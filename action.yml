name: AI Checks
description: Run .checks markdown files as a read-only agent on a pull request and post the results as one comment. The provider, model, API key, and base URL are inputs, so the workflow is not tied to one vendor. Check definitions are read from the pull request's base commit, so a pull request cannot change the checks that review it.
author: nextcli-dev

branding:
  icon: check-square
  color: blue

inputs:
  mode:
    description: run (default) runs checks and completes their check runs. list only outputs the JSON array of check names in `checks`, for a matrix. comment posts the results in results-dir as one pull request comment, or updates the comment from an earlier run.
    required: false
    default: run
  pr-number:
    description: Pull request number. Defaults to the pull request of the triggering event. Set it when the workflow is not triggered by a pull_request event, for example workflow_dispatch.
    required: false
    default: ""
  agent:
    description: Agent CLI that runs each check. opencode (default), nextcli, or claude-code. claude-code only supports anthropic, openrouter, and deepseek.
    required: false
    default: opencode
  agent-version:
    description: Version of the agent CLI to install. Defaults to opencode-ai 1.19.5, @anthropic-ai/claude-code 2.1.312, or @nextcli/cli 0.8.1. Ignored for nextcli when nextcli-ref is set.
    required: false
    default: ""
  provider:
    description: Model provider. One of anthropic, openai, deepseek, openrouter, or openai-compatible (any OpenAI-compatible base URL, including oneprovider.dev). Required in run mode.
    required: false
    default: ""
  model:
    description: Model id, such as claude-sonnet-4-5 or deepseek-v4-pro. A check frontmatter value of provider/model overrides this for that check. Required in run mode.
    required: false
    default: ""
  api-key:
    description: Provider API key. Exposed to the agent only as PROVIDER_API_KEY, and removed from everything posted or uploaded. Not needed in list mode.
    required: false
    default: ""
  base-url:
    description: Provider base URL. Optional for named providers. Required for openai-compatible.
    required: false
    default: ""
  max-cost:
    description: US dollars one check may spend, for the nextcli agent. Near the limit the agent stops and reports what it found so far, and the comment marks the review as partial. Empty for no limit. Other agents ignore it.
    required: false
    default: "1"
  max-output-tokens:
    description: Output tokens one model call may produce, thinking included, for the nextcli agent. Empty uses the provider's default, which is 4,096 on DeepSeek and can be used up by thinking before the answer is written.
    required: false
    default: ""
  max-turns:
    description: Model calls one check may make, for the nextcli agent. At the limit the agent reports what it found so far, and the comment marks the review as partial. Empty (default) allows one call per 20 seconds of the time left, at most 60, so the turn limit comes before timeout-per-check. 0 for no limit. Other agents ignore it.
    required: false
    default: ""
  install:
    description: none (default) or auto. auto installs the dependencies of the projects that hold the changed files, so the agent can read a library inside the repository instead of searching the runner for it. npm, pnpm, and Yarn 1 (scripts off), pip (requirements files, wheels only), Go, and Cargo run in a throwaway container. The checkout is read-only and project code does not run. NuGet, Maven, Gradle, and Yarn 2+ are not installed. A check can set `install:` in its frontmatter to override this. Nothing is installed for a check that its paths skip. A failed install is a warning.
    required: false
    default: none
  results-dir:
    description: In comment mode, the directory that holds the check-*.verdict.json files from the run jobs, usually their downloaded check-results artifacts.
    required: false
    default: ""
  timeout-per-check:
    description: Minutes allowed for each check, its retry included, before it is reported as an error.
    required: false
    default: "10"
  max-diff-bytes:
    description: Maximum number of PR diff bytes passed to the agent.
    required: false
    default: "100000"
  on-error:
    description: Check-run conclusion when the agent output cannot be parsed. neutral (default) or failure.
    required: false
    default: neutral
  check:
    description: Run only this check (the file name without .md). Leave empty to run every check in the checks directory.
    required: false
    default: ""
  checks-dir:
    description: Directory of check markdown files, relative to the repository root. Read from the pull request's base commit.
    required: false
    default: .checks
  nextcli-ref:
    description: Branch, tag, or commit SHA used to build the NextCLI CLI from source when agent is nextcli. When empty, @nextcli/cli is installed from npm at agent-version.
    required: false
    default: ""
  nextcli-repository:
    description: Git repository cloned when nextcli-ref is set.
    required: false
    default: https://github.com/nextcli-dev/nextcli.git

outputs:
  checks:
    description: In list mode, the JSON array of check names (file names without .md) in checks-dir at the base commit.
    value: ${{ steps.list.outputs.checks }}

runs:
  using: composite
  steps:
    - name: Resolve the pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_INPUT: ${{ inputs.pr-number }}
        EVENT_PR: ${{ github.event.pull_request.number }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$MODE" in
          run|list|comment) ;;
          *) echo "::error::mode must be run, list or comment (got '$MODE')."; exit 1 ;;
        esac
        number="${PR_INPUT:-$EVENT_PR}"
        if [ -z "$number" ]; then
          echo "::error::No pull request. Set pr-number when the workflow is not triggered by a pull request."
          exit 1
        fi
        gh api "repos/${GH_REPO}/pulls/${number}" > "$RUNNER_TEMP/pr.json"
        {
          echo "number=${number}"
          echo "base_sha=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"
          echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
        } >> "$GITHUB_OUTPUT"

    # The agent reads the pull request's code. Blobs are fetched on demand and
    # credentials are not kept in .git/config.
    - name: Checkout the pull request
      if: inputs.mode == 'run'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/pull/${{ steps.pr.outputs.number }}/head
        fetch-depth: 0
        filter: blob:none
        persist-credentials: false

    # Check definitions come from the base commit, so the pull request under
    # review cannot edit or delete them.
    - name: Checkout the checks from the base commit
      if: inputs.mode != 'comment'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.pr.outputs.base_sha }}
        path: .nextcli-checks-base
        sparse-checkout: ${{ inputs.checks-dir }}
        fetch-depth: 1
        persist-credentials: false

    # The checks are read from a copy outside the workspace, made before
    # anything is installed. The install container mounts the checkout
    # read-only and does not run project code.
    - name: Copy the checks out of the workspace
      if: inputs.mode == 'run'
      shell: bash
      env:
        SOURCE: ${{ github.workspace }}/.nextcli-checks-base/${{ inputs.checks-dir }}
        TARGET: ${{ runner.temp }}/nextcli-checks
      run: |
        if [ -d "$SOURCE" ]; then
          mkdir -p "$TARGET"
          cp -R "$SOURCE/." "$TARGET/"
        fi

    - name: List checks
      id: list
      if: inputs.mode == 'list'
      shell: bash
      env:
        CHECKS_DIR: ${{ github.workspace }}/.nextcli-checks-base/${{ inputs.checks-dir }}
      run: |
        checks="$(python3 "$GITHUB_ACTION_PATH/scripts/checks.py" list --dir "$CHECKS_DIR")"
        echo "checks=${checks}" >> "$GITHUB_OUTPUT"
        echo "Checks: ${checks}"

    - name: Skip commits from github-actions
      id: bot
      if: inputs.mode == 'run'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
      run: bash "$GITHUB_ACTION_PATH/scripts/skip-bot.sh"

    - name: Setup Node
      if: inputs.mode == 'run' && steps.bot.outputs.skip != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Cache agent package downloads
      if: inputs.mode == 'run' && steps.bot.outputs.skip != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: checks-agent-${{ inputs.agent }}-${{ inputs.agent-version || 'default' }}-${{ inputs.nextcli-ref || 'npm' }}-${{ runner.os }}

    - name: Install agent CLI
      if: inputs.mode == 'run' && steps.bot.outputs.skip != 'true'
      shell: bash
      env:
        CHECKS_AGENT: ${{ inputs.agent }}
        CHECKS_AGENT_VERSION: ${{ inputs.agent-version }}
        CHECKS_NEXTCLI_REF: ${{ inputs.nextcli-ref }}
        CHECKS_NEXTCLI_REPOSITORY: ${{ inputs.nextcli-repository }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install-agent.sh"

    - name: Fetch the pull request diff
      if: inputs.mode == 'run' && steps.bot.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        CHECKS_MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
      run: bash "$GITHUB_ACTION_PATH/scripts/prepare-diff.sh"

    # Install only when a check this job runs will run its agent and wants
    # dependencies (its `install:` frontmatter, else the install input).
    - name: Decide whether to install dependencies
      id: install
      if: inputs.mode == 'run' && steps.bot.outputs.skip != 'true'
      shell: bash
      env:
        CHECKS_DIR: ${{ runner.temp }}/nextcli-checks
        CHECKS_ONLY: ${{ inputs.check }}
        CHECKS_INSTALL: ${{ inputs.install }}
      run: |
        changed=()
        if [ -f /tmp/changed-files.txt ]; then
          changed=(--changed /tmp/changed-files.txt)
        fi
        wanted="$(python3 "$GITHUB_ACTION_PATH/scripts/checks.py" install-wanted \
          --dir "$CHECKS_DIR" --only "$CHECKS_ONLY" --default "$CHECKS_INSTALL" ${changed[@]+"${changed[@]}"})"
        echo "install=${wanted}" >> "$GITHUB_OUTPUT"
        echo "Dependency install: ${wanted}"

    - name: Cache dependency downloads
      if: inputs.mode == 'run' && steps.install.outputs.install == 'auto'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/checks-deps-cache
        key: checks-deps-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/requirements*.txt', '**/go.sum', '**/Cargo.lock') }}
        restore-keys: checks-deps-${{ runner.os }}-

    # Downloads dependencies in throwaway containers. The checkout is read-only,
    # project code does not run, and this step gets no secrets. NuGet, Maven,
    # Gradle, and Yarn 2+ are not installed.
    - name: Install dependencies
      if: inputs.mode == 'run' && steps.install.outputs.install == 'auto'
      shell: bash
      env:
        CHECKS_INSTALL: auto
        CHECKS_DEPS_CACHE: ${{ runner.temp }}/checks-deps-cache
      run: bash "$GITHUB_ACTION_PATH/scripts/install-deps.sh"

    - name: Run checks
      if: inputs.mode == 'run'
      shell: bash
      env:
        CHECKS_AGENT: ${{ inputs.agent }}
        CHECKS_PROVIDER: ${{ inputs.provider }}
        CHECKS_MODEL: ${{ inputs.model }}
        PROVIDER_API_KEY: ${{ inputs.api-key }}
        CHECKS_BASE_URL: ${{ inputs.base-url }}
        CHECKS_TIMEOUT: ${{ inputs.timeout-per-check }}
        CHECKS_MAX_COST: ${{ inputs.max-cost }}
        CHECKS_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        CHECKS_MAX_TURNS: ${{ inputs.max-turns }}
        CHECKS_ON_ERROR: ${{ inputs.on-error }}
        CHECKS_ONLY: ${{ inputs.check }}
        CHECKS_DIR: ${{ runner.temp }}/nextcli-checks
        CHECKS_SKIP_REASON: ${{ steps.bot.outputs.skip == 'true' && 'The head commit was made by github-actions[bot].' || '' }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-checks.sh"

    # The result is also written to the job summary, so a run whose comment job
    # never starts still shows what the check found.
    - name: Write the job summary
      if: always() && inputs.mode == 'run'
      shell: bash
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        CHECKS_MAX_COST: ${{ inputs.max-cost }}
      run: |
        dir="$(mktemp -d)"
        cp /tmp/check-*.verdict.json "$dir"/ 2>/dev/null || true
        python3 "$GITHUB_ACTION_PATH/scripts/checks.py" render-comment \
          --dir "$dir" --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" \
          --max-cost "$CHECKS_MAX_COST" >> "$GITHUB_STEP_SUMMARY" || true

    - name: Close unfinished check runs
      if: always() && inputs.mode == 'run'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/scripts/close-check-runs.sh"

    - name: Remove secrets from check outputs
      if: always() && inputs.mode == 'run'
      shell: bash
      env:
        PROVIDER_API_KEY: ${{ inputs.api-key }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/checks.py" redact /tmp/check-*.json /tmp/check-*.err /tmp/check-*.calls.jsonl

    - name: Upload check outputs
      if: always() && inputs.mode == 'run' && steps.bot.outputs.skip != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: check-results${{ inputs.check != '' && format('-{0}', inputs.check) || '' }}
        path: |
          /tmp/check-*.json
          /tmp/check-*.err
          /tmp/check-*.calls.jsonl
        retention-days: 7
        if-no-files-found: ignore

    # One comment for every check, edited in place on later runs. Each finding
    # links to its file and line; there are no inline review comments.
    - name: Post the combined comment
      if: inputs.mode == 'comment'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        CHECKS_RESULTS_DIR: ${{ inputs.results-dir }}
        CHECKS_MAX_COST: ${{ inputs.max-cost }}
      run: bash "$GITHUB_ACTION_PATH/scripts/comment.sh"
