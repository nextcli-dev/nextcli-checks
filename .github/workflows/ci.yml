name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: for f in scripts/*.sh scripts/agents/*.sh; do bash -n "$f"; done
      - name: Unit tests
        run: python3 -I scripts/test_checks.py
